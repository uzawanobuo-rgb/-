<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>アクセス案内シート作成</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css?v=202609301530">
</head>
<body>
<header class="topbar">
  <div class="brand">アクセス案内シート作成<span class="brand-sub">アットイン営業用</span></div>
  <nav class="tabs" role="tablist">
    <button type="button" role="tab" data-action="pattern" data-value="p1">パターン1　物件 → 主要駅</button>
    <button type="button" role="tab" data-action="pattern" data-value="p2">パターン2　目的地 → 3物件</button>
  </nav>
  <div class="progress" id="progress" aria-label="入力の進み具合"></div>
  <div class="top-actions">
    <button type="button" class="btn ghost" data-action="reset">新規</button>
    <details class="menu" id="menu">
      <summary class="btn ghost">その他 ▾</summary>
      <div class="menu-pop" role="menu">
        <button type="button" class="menu-item" data-action="save-json">データ保存<small>入力内容をファイルに保存</small></button>
        <label class="menu-item file-btn">データ読込<small>保存したファイルから再開</small><input type="file" accept="application/json,.json" data-action="load-json" hidden></label>
        <button type="button" class="menu-item" data-action="sample">見本を読み込む<small>操作の確認用</small></button>
      </div>
    </details>
  </div>
</header>

<main class="layout">
  <section class="form-col" id="form" aria-label="入力と確認"></section>
  <section class="preview-col" aria-label="プレビュー">
    <div class="preview-bar">
      <div class="preview-title">プレビュー（A4横）</div>
      <div class="preview-actions">
        <button type="button" class="btn primary" data-action="png">PNG</button>
        <button type="button" class="btn primary" data-action="pdf">PDF</button>
        <button type="button" class="btn" data-action="print">印刷</button>
      </div>
    </div>
    <div class="warnings" id="warnings"></div>
    <div class="sheet-wrap" id="sheet-wrap"><div class="sheet-scale" id="sheet"></div></div>
    <p class="hint">プレビューは入力に合わせて自動で更新されます。お客様に渡す前に、所要時間・料金・見出しを必ず確認してください。</p>
  </section>
</main>

<div id="export-root" aria-hidden="true"></div>
<div id="toast" role="status"></div>

<script src="vendor/html-to-image.js?v=202609301530"></script>
<script src="vendor/jspdf.umd.min.js?v=202609301530"></script>
<script src="js/calc.js?v=202609301530"></script>
<script src="js/geo.js?v=202609301530"></script>
<script src="js/data.js?v=202609301530"></script>
<script src="js/icons.js?v=202609301530"></script>
<script src="js/parse.js?v=202609301530"></script>
<script src="js/map.js?v=202609301530"></script>
<script src="js/sheet.js?v=202609301530"></script>
<script src="js/samples.js?v=202609301530"></script>
<script src="js/bm-transit.js?v=202609301530"></script>
<script src="js/app.js?v=202609301530"></script>
</body>
</html>

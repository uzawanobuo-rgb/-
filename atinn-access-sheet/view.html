<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>アクセスのご案内｜アットイン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; background: #E9E6DE; font-family: 'M PLUS 1p', 'Hiragino Sans', sans-serif; color: #1E2B33; }
  /* 共有リンクで開いたページ：画面の幅に合わせて縦型（スマホ）・横型（パソコン）を切り替え、幅いっぱいに縮小して見せる */
  #pages { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 12px 0 24px; }
  .page-wrap { overflow: hidden; box-shadow: 0 2px 12px rgba(30,43,51,.15); background: #F7F6F2; }
  .page-scale { transform-origin: 0 0; }
  #msg { max-width: 520px; margin: 60px auto; padding: 24px; background: #fff; border-radius: 12px; text-align: center; line-height: 1.8; }
</style>
</head>
<body>
<div id="pages"></div>
<div id="msg" hidden></div>

<script src="js/calc.js?v=202610050500"></script>
<script src="js/geo.js?v=202610050500"></script>
<script src="js/data.js?v=202610050500"></script>
<script src="js/icons.js?v=202610050500"></script>
<script src="js/parse.js?v=202610050500"></script>
<script src="js/map.js?v=202610050500"></script>
<script src="js/logo.js?v=202610050500"></script>
<script src="js/sheet.js?v=202610050500"></script>
<script src="js/share.js?v=202610050500"></script>
<script>
(async function () {
  const box = document.getElementById('pages'), msg = document.getElementById('msg');
  let state = null;
  try { state = await window.AtinnShare.decode(location.hash); } catch (e) { state = null; }
  if (!state) {
    msg.hidden = false;
    msg.innerHTML = 'ご案内の内容を読み込めませんでした。<br>リンクが途中で切れていないか、お送りしたリンクをもう一度開いてください。';
    return;
  }
  let mode = '';
  function render() {
    const portrait = window.innerWidth < 760;
    const want = portrait ? 'p' : 'l';
    if (want !== mode) {
      mode = want;
      const r = window.AtinnSheet.buildSheet(state, { portrait });
      document.title = (r.model && r.model.title ? r.model.title + '｜' : '') + 'アットイン';
      box.innerHTML = r.pages.map(h => `<div class="page-wrap"><div class="page-scale">${h}</div></div>`).join('');
    }
    // 画面の幅に合わせて縮小（拡大はしない）
    box.querySelectorAll('.page-wrap').forEach(w => {
      const page = w.firstElementChild.firstElementChild;
      const pw = page.offsetWidth, ph = page.offsetHeight;
      const s = Math.min(1, (window.innerWidth - (portrait ? 0 : 24)) / pw);
      w.firstElementChild.style.transform = `scale(${s})`;
      w.style.width = Math.round(pw * s) + 'px';
      w.style.height = Math.round(ph * s) + 'px';
    });
  }
  render();
  if (document.fonts) document.fonts.ready.then(render);
  let t = null;
  window.addEventListener('resize', () => { clearTimeout(t); t = setTimeout(render, 150); });
})();
</script>
</body>
</html>

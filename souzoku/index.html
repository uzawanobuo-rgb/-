<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b6cb0">
<title>相続分配計算</title>
<style>
  :root { --bg:#f2f4f7; --card:#fff; --text:#1f2328; --sub:#6b7280; --line:#dde1e6; --accent:#2b6cb0; --accent-bg:#e8f0fb; --danger:#c53030; --warn-bg:#fff6e5; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", Meiryo, sans-serif; }
  main { max-width:560px; margin:0 auto; padding:12px 16px calc(96px + env(safe-area-inset-bottom)); }
  h1 { font-size:1.25rem; margin:8px 0 12px; }
  h2 { font-size:1rem; margin:0 0 10px; }
  section { background:var(--card); border-radius:14px; padding:14px; margin-bottom:12px; box-shadow:0 1px 2px rgba(0,0,0,.05); }
  input, select, button { font:inherit; font-size:16px; }
  input[type=text], input[type=number] { width:100%; min-height:44px; padding:8px 10px; border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--text); }
  button { min-height:44px; padding:8px 14px; border-radius:10px; border:1px solid var(--accent); background:var(--accent); color:#fff; cursor:pointer; }
  button.sub { background:#fff; color:var(--accent); }
  button.del { min-height:36px; padding:4px 10px; background:#fff; color:var(--danger); border-color:#ecc; font-size:14px; }
  .note { color:var(--sub); font-size:13px; margin:8px 0 0; }
  .total-input { display:flex; align-items:center; gap:8px; }
  .total-input input { font-size:22px; font-weight:700; text-align:right; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px; }
  .grid2 label { display:block; font-size:13px; color:var(--sub); margin-bottom:4px; }
  .btns { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px; }
  .hidden { display:none !important; }

  .contrib { display:grid; grid-template-columns:1fr 84px auto; gap:8px; align-items:center; margin-bottom:8px; }

  .seg { display:grid; grid-template-columns:1fr 1fr; border:1px solid var(--accent); border-radius:10px; overflow:hidden; }
  .seg button { border:0; border-radius:0; background:#fff; color:var(--accent); min-height:44px; font-size:14px; line-height:1.3; }
  .seg button.on { background:var(--accent); color:#fff; }

  .heir { border:1px solid var(--line); border-radius:12px; padding:10px; margin-bottom:10px; }
  .heir.dead { background:#fafafa; }
  .heir-top { display:grid; grid-template-columns:1fr auto; gap:8px; align-items:center; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .chip { min-height:36px; padding:4px 12px; border-radius:18px; border:1px solid var(--line); background:#fff; color:var(--sub); font-size:14px; }
  .chip.on { background:var(--accent-bg); border-color:var(--accent); color:var(--accent); font-weight:600; }
  .chip.on::before { content:"✓ "; }
  .chip.flag.on { background:#fdecec; border-color:var(--danger); color:var(--danger); }
  .lbl { font-size:12px; color:var(--sub); margin:8px 0 0; }
  .kids { margin-top:10px; padding-left:10px; border-left:3px solid var(--accent-bg); }
  .kid { padding:8px 0; border-bottom:1px dashed var(--line); }
  .kid:last-of-type { border-bottom:0; }
  .kids .add-kid { width:100%; margin-top:6px; min-height:40px; font-size:14px; }
  .warn { background:var(--warn-bg); border-radius:8px; padding:6px 10px; font-size:13px; margin-top:8px; }
  .empty { color:var(--sub); font-size:14px; text-align:center; padding:12px 0; }

  .unit { background:var(--accent-bg); border-radius:10px; padding:10px 12px; font-size:14px; margin-bottom:10px; }
  .unit b { font-size:17px; }
  .res { display:grid; grid-template-columns:1fr auto; gap:2px 10px; padding:10px 0; border-bottom:1px solid var(--line); }
  .res .name { font-weight:700; }
  .res .name small { font-weight:400; color:var(--sub); }
  .res .amt { font-weight:700; font-size:18px; text-align:right; white-space:nowrap; }
  .res .detail { font-size:13px; color:var(--sub); }
  .res .pct { font-size:13px; color:var(--sub); text-align:right; white-space:nowrap; }
  .res-total { display:flex; justify-content:space-between; padding:12px 0 0; font-weight:700; font-size:17px; }

  .bar { position:fixed; left:0; right:0; bottom:0; background:rgba(255,255,255,.96); border-top:1px solid var(--line); padding:8px 16px calc(8px + env(safe-area-inset-bottom)); backdrop-filter:blur(6px); }
  .bar-in { max-width:560px; margin:0 auto; display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:14px; }
  .bar-in b { font-size:16px; }
  .bar button { min-height:40px; font-size:14px; padding:6px 12px; }

  @media print {
    body { background:#fff; }
    .no-print, .bar, button { display:none !important; }
    section { box-shadow:none; padding:0 0 8px; }
  }
</style>
</head>
<body>
<main>
  <h1>相続分配計算</h1>

  <section>
    <h2>相続総額</h2>
    <div class="total-input">
      <input type="text" id="total" inputmode="numeric" placeholder="0" autocomplete="off">
      <span>円</span>
    </div>
  </section>

  <section class="no-print">
    <h2>計算方式</h2>
    <div class="seg" id="modeSeg">
      <button data-mode="legal">法定どおり<br>（親の分を人数割り）</button>
      <button data-mode="fixed">固定口数<br>（甥・姪は一律）</button>
    </div>
    <div class="grid2">
      <div><label for="wSib">兄弟姉妹（口）</label><input type="number" id="wSib" inputmode="decimal" min="0" step="0.5"></div>
      <div id="wNepBox"><label for="wNep">甥・姪（口）</label><input type="number" id="wNep" inputmode="decimal" min="0" step="0.5"></div>
    </div>
    <p class="note" id="modeNote"></p>
  </section>

  <section class="no-print">
    <h2>寄与分（名前・口数）</h2>
    <div id="contribList"></div>
    <button class="sub" id="addContrib" style="width:100%">＋ 寄与分を追加</button>
  </section>

  <section class="no-print">
    <h2>兄弟姉妹</h2>
    <div id="heirList"></div>
    <button class="sub" id="addSib" style="width:100%">＋ 兄弟姉妹を追加</button>
    <p class="note">先に亡くなった兄弟は「亡くなっている」をタップすると、その子（甥・姪）を追加できます。寄与分の名前をタップすると付け外しできます。</p>
  </section>

  <section id="result">
    <h2>計算結果</h2>
    <div class="unit" id="unitInfo"></div>
    <div id="resList"></div>
    <div id="resTotal"></div>
    <p class="note" id="roundNote"></p>
    <div class="btns no-print">
      <button id="print">印刷 / PDF</button>
      <button class="sub" id="reset">すべてクリア</button>
    </div>
  </section>

  <p class="note">※ 配偶者がいない場合の兄弟姉妹・甥姪の相続を想定しています（配偶者がいる場合、兄弟姉妹全体の取り分は1/4）。生きている兄弟の子は相続人になりません。最終的な分け方は相続人全員の合意で決まります。個別の事情は専門家にご確認ください。</p>
</main>

<div class="bar no-print">
  <div class="bar-in">
    <span id="barInfo"></span>
    <button class="sub" id="toResult">結果を見る ↓</button>
  </div>
</div>

<script>
(function () {
  var KEY = 'souzoku-calc-v2';
  var state = load() || {
    total: '',
    mode: 'legal',
    wSib: 2, wNep: 1,
    contribs: [{ id: 1, name: '寄与分A', units: 1 }, { id: 2, name: '寄与分B', units: 1 }],
    sibs: [],
    seq: 3
  };

  var $ = function (id) { return document.getElementById(id); };
  var yen = function (n) { return Math.round(n).toLocaleString('ja-JP'); };
  var num = function (v) { var n = parseFloat(String(v).replace(/[,，\s円]/g, '')); return isFinite(n) ? n : 0; };
  var fmt = function (n) { return String(Math.round(n * 100) / 100); };
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };

  function load() { try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; } }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

  // 兄弟・甥姪どちらでも id で探す
  function person(id) {
    id = +id;
    for (var i = 0; i < state.sibs.length; i++) {
      var s = state.sibs[i];
      if (s.id === id) return s;
      for (var j = 0; j < s.kids.length; j++) if (s.kids[j].id === id) return s.kids[j];
    }
  }

  function chipsHtml(p) {
    if (!state.contribs.length) return '';
    return '<div class="chips">' + state.contribs.map(function (c) {
      return '<button class="chip' + (p.contribs.indexOf(c.id) >= 0 ? ' on' : '') + '" data-p="' + p.id + '" data-cc="' + c.id + '">' +
        esc(c.name || '（無名）') + '</button>';
    }).join('') + '</div>';
  }

  function renderSettings() {
    [].forEach.call(document.querySelectorAll('#modeSeg button'), function (b) {
      b.classList.toggle('on', b.dataset.mode === state.mode);
    });
    $('wNepBox').classList.toggle('hidden', state.mode === 'legal');
    $('modeNote').textContent = state.mode === 'legal'
      ? '民法どおり、亡くなった兄弟の口数をその子（甥・姪）の人数で等分します。例：兄弟2口・子2人 → 1人1口。'
      : '甥・姪は人数にかかわらず一律の口数です（相続人全員が合意した分け方をする場合など）。';
  }

  function renderContribs() {
    $('contribList').innerHTML = state.contribs.map(function (c) {
      return '<div class="contrib">' +
        '<input type="text" data-c="' + c.id + '" data-f="name" value="' + esc(c.name) + '" placeholder="名前">' +
        '<input type="number" inputmode="decimal" data-c="' + c.id + '" data-f="units" min="0" step="0.5" value="' + esc(c.units) + '">' +
        '<button class="del" data-delc="' + c.id + '">削除</button></div>';
    }).join('') || '<div class="empty">寄与分はありません</div>';
  }

  function renderHeirs() {
    $('heirList').innerHTML = state.sibs.map(function (s) {
      var html = '<div class="heir' + (s.dead ? ' dead' : '') + '">' +
        '<div class="heir-top"><input type="text" data-p="' + s.id + '" data-f="name" value="' + esc(s.name) + '" placeholder="兄弟姉妹の名前">' +
        '<button class="del" data-del="' + s.id + '">削除</button></div>' +
        '<div class="chips">' +
          '<button class="chip flag' + (s.dead ? ' on' : '') + '" data-flag="dead" data-p="' + s.id + '">亡くなっている</button>' +
          '<button class="chip' + (s.half ? ' on' : '') + '" data-flag="half" data-p="' + s.id + '">異父・異母（半分）</button>' +
        '</div>';
      if (!s.dead) {
        html += state.contribs.length ? '<p class="lbl">寄与分</p>' + chipsHtml(s) : '';
      } else {
        html += '<div class="kids">' + s.kids.map(function (k) {
          return '<div class="kid"><div class="heir-top">' +
            '<input type="text" data-p="' + k.id + '" data-f="name" value="' + esc(k.name) + '" placeholder="甥・姪の名前">' +
            '<button class="del" data-del="' + k.id + '">削除</button></div>' + chipsHtml(k) + '</div>';
        }).join('') +
        (s.kids.length ? '' : '<div class="warn">子（甥・姪）がいなければ、この兄弟の分はほかの兄弟で分けます。</div>') +
        '<button class="sub add-kid" data-addkid="' + s.id + '">＋ 子（甥・姪）を追加</button></div>';
      }
      return html + '</div>';
    }).join('') || '<div class="empty">下のボタンで兄弟姉妹を追加してください</div>';
  }

  // 受け取る人ごとに口数を出す
  function people() {
    var wSib = num(state.wSib), wNep = num(state.wNep), out = [];
    function addContribs(p, row) {
      state.contribs.forEach(function (c) {
        if (p.contribs.indexOf(c.id) >= 0) { row.units += num(c.units); row.parts.push(c.name + ' ' + fmt(num(c.units))); }
      });
      return row;
    }
    state.sibs.forEach(function (s) {
      var line = wSib * (s.half ? 0.5 : 1);
      var halfTxt = s.half ? '（半分）' : '';
      if (!s.dead) {
        out.push(addContribs(s, { p: s, label: '兄弟姉妹', units: line, parts: ['兄弟姉妹' + halfTxt + ' ' + fmt(line)] }));
        return;
      }
      var n = s.kids.length;
      s.kids.forEach(function (k) {
        var base, part;
        if (state.mode === 'legal') {
          base = line / n;
          part = (s.name || '親') + 'の分' + halfTxt + ' ' + fmt(line) + (n > 1 ? ' ÷ ' + n + '人' : '');
        } else {
          base = wNep * (s.half ? 0.5 : 1);
          part = '甥・姪' + halfTxt + ' ' + fmt(base);
        }
        out.push(addContribs(k, { p: k, label: (s.name || '兄弟') + 'の子', units: base, parts: [part] }));
      });
    });
    return out;
  }

  function calc() {
    var total = num(state.total);
    var rows = people();
    var sumUnits = rows.reduce(function (s, r) { return s + r.units; }, 0);
    var unitYen = sumUnits > 0 ? total / sumUnits : 0;

    // 1円未満は切り捨て、端数は端数の大きい人から1円ずつ配分して合計を総額に一致させる
    rows.forEach(function (r) { r.exact = unitYen * r.units; r.yen = Math.floor(r.exact + 1e-6); });
    var rem = sumUnits > 0 ? Math.round(total) - rows.reduce(function (s, r) { return s + r.yen; }, 0) : 0;
    var remOrig = rem;
    rows.slice().sort(function (a, b) { return (b.exact - b.yen) - (a.exact - a.yen) || b.units - a.units; })
      .forEach(function (r) { if (rem > 0 && r.units > 0) { r.yen++; rem--; } });

    $('unitInfo').innerHTML = sumUnits > 0
      ? '総額 <b>' + yen(total) + '</b> 円 ÷ 合計 <b>' + fmt(sumUnits) + '</b> 口<br>1口あたり <b>' + yen(unitYen) + '</b> 円'
      : '兄弟姉妹（または甥・姪）を追加してください';
    $('resList').innerHTML = rows.map(function (r) {
      return '<div class="res"><div class="name">' + (esc(r.p.name) || '（名前未入力）') + ' <small>' + esc(r.label) + '</small></div>' +
        '<div class="amt">' + yen(r.yen) + ' 円</div>' +
        '<div class="detail">' + r.parts.map(esc).join(' ＋ ') + ' ＝ ' + fmt(r.units) + '口</div>' +
        '<div class="pct">' + (sumUnits ? (r.units / sumUnits * 100).toFixed(2) : '0.00') + '%</div></div>';
    }).join('');
    $('resTotal').innerHTML = rows.length
      ? '<div class="res-total"><span>合計 ' + fmt(sumUnits) + '口</span><span>' + yen(rows.reduce(function (s, r) { return s + r.yen; }, 0)) + ' 円</span></div>'
      : '';
    $('roundNote').textContent = remOrig > 0
      ? '※ 1円未満の端数（計 ' + remOrig + ' 円）は、端数の大きい人から1円ずつ配分しています。' : '';
    $('barInfo').innerHTML = '合計 <b>' + fmt(sumUnits) + '</b>口 ／ 1口 <b>' + yen(unitYen) + '</b> 円';
  }

  function renderAll() { renderSettings(); renderContribs(); renderHeirs(); calc(); save(); }

  function focusLast(sel) {
    var inputs = document.querySelectorAll(sel);
    if (inputs.length) inputs[inputs.length - 1].focus();
  }

  document.addEventListener('input', function (e) {
    var t = e.target, d = t.dataset;
    if (t.id === 'total') {
      var raw = t.value.replace(/[０-９]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); }).replace(/[^\d]/g, '');
      state.total = raw;
      t.value = raw ? Number(raw).toLocaleString('ja-JP') : '';
    } else if (t.id === 'wSib' || t.id === 'wNep') {
      state[t.id] = t.value;
    } else if (d.c) {
      state.contribs.filter(function (c) { return c.id === +d.c; })[0][d.f] = t.value;
      if (d.f === 'name') renderHeirs();
    } else if (d.p && d.f) {
      person(d.p)[d.f] = t.value;
    } else { return; }
    calc(); save();
  });

  document.addEventListener('click', function (e) {
    var t = e.target.closest('button');
    if (!t) return;
    var d = t.dataset, p;
    if (d.mode) {
      state.mode = d.mode;
      renderAll();
    } else if (t.id === 'addSib') {
      state.sibs.push({ id: state.seq++, name: '', dead: false, half: false, contribs: [], kids: [] });
      renderAll();
      focusLast('#heirList .heir > .heir-top input');
    } else if (d.addkid) {
      person(d.addkid).kids.push({ id: state.seq++, name: '', contribs: [] });
      renderAll();
      var kidInputs = document.querySelector('[data-addkid="' + d.addkid + '"]').parentNode.querySelectorAll('.kid input');
      if (kidInputs.length) kidInputs[kidInputs.length - 1].focus();
    } else if (t.id === 'addContrib') {
      state.contribs.push({ id: state.seq++, name: '寄与分' + String.fromCharCode(65 + state.contribs.length), units: 1 });
      renderAll();
    } else if (d.flag) {
      p = person(d.p);
      p[d.flag] = !p[d.flag];
      if (d.flag === 'dead' && p.dead) p.contribs = [];
      renderAll();
    } else if (d.cc) {
      p = person(d.p);
      var cid = +d.cc, i = p.contribs.indexOf(cid);
      if (i >= 0) p.contribs.splice(i, 1); else p.contribs.push(cid);
      renderAll();
    } else if (d.del) {
      p = person(d.del);
      if ((p.name || (p.kids && p.kids.length)) && !confirm((p.name || 'この人') + ' を削除しますか？')) return;
      var id = +d.del;
      state.sibs = state.sibs.filter(function (s) { return s.id !== id; });
      state.sibs.forEach(function (s) { s.kids = s.kids.filter(function (k) { return k.id !== id; }); });
      renderAll();
    } else if (d.delc) {
      var cid2 = +d.delc;
      state.contribs = state.contribs.filter(function (c) { return c.id !== cid2; });
      state.sibs.forEach(function (s) {
        [s].concat(s.kids).forEach(function (x) { x.contribs = x.contribs.filter(function (y) { return y !== cid2; }); });
      });
      renderAll();
    } else if (t.id === 'toResult') {
      $('result').scrollIntoView({ behavior: 'smooth' });
    } else if (t.id === 'print') {
      window.print();
    } else if (t.id === 'reset') {
      if (confirm('入力内容をすべてクリアしますか？')) {
        try { localStorage.removeItem(KEY); } catch (err) {}
        location.reload();
      }
    }
  });

  $('total').value = state.total ? Number(state.total).toLocaleString('ja-JP') : '';
  $('wSib').value = state.wSib;
  $('wNep').value = state.wNep;
  renderAll();
})();
</script>
</body>
</html>
